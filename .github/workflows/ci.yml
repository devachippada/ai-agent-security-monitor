name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Build the labeled dataset
        run: python scripts/build_dataset.py

      - name: Train and evaluate the anomaly model
        # test_phase2.py exercises the real Isolation Forest, so it must
        # exist before pytest runs -- same seeded, deterministic commands
        # start.sh and the Dockerfile use.
        run: |
          python train_model.py --n-samples 2000 --contamination 0.05 --seed 42
          python evaluate_model.py --n-normal 400 --n-abnormal 400 --seed 1337

      - name: Test (pytest)
        run: pytest -v

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30's bundled undici calls a worker_threads API that
          # Node 20 doesn't have ("webidl.util.markAsUncloneable is not
          # a function"), which crashes vitest before any test runs.
          # Node 22+ has it -- verified locally on Node 22.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Test (vitest)
        run: npm run test

      - name: Build
        run: npm run build
